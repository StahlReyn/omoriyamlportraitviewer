<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body { 
            font-family: var("OMORI_GAME2", --vscode-font-family, sans-serif); 
            padding: 20px; 
            color: white; 
            background-color: rgb(44, 45, 58);
            margin: 0;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            border-bottom: 1px solid white;
            padding-bottom: 10px;
        }
        .flow-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 800px;
            margin: 0 auto;
        }
        .dialogue-card {
            background-color: black;
            border: 4px solid white;
            outline: 2px solid black;
            padding: 8px;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            color: gray;
            font-size: 0.8rem;
        }
        .dialogue-text {
            font-size: 1rem;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
            padding: 4px 0;
        }
    </style>
</head>
<body>

    <h1>Dialogue Preview</h1>
    <div id="flow" class="flow-container"></div>

    <script>
        window.addEventListener('message', event => {
            const message = event.data;
            if (message.command === 'load') {
                renderFlow(message.data || {});
            }
        });

        function renderFlow(data) {
            const container = document.getElementById('flow');
            container.innerHTML = '';

            Object.keys(data).forEach(key => {
                const node = data[key];
                const card = document.createElement('div');
                card.className = 'dialogue-card';

                const faceset = node.faceset || 'None';
                const faceindex = node.faceindex !== undefined ? `[${node.faceindex}]` : '';
                const text = node.text || '';
                
                // Generate the image HTML string if a valid URI was computed by the extension
                const imgHtml = node.imageUri 
                    ? `<img src="${node.imageUri}" alt="${faceset}" class="portrait-img" />` 
                    : `<div class="no-portrait">No Image</div>`;

                card.innerHTML = `
                    <div class="card-header">
                        <span class="msg-id">${key}</span>
                        <div class="face-info">
                            Face: <span class="face-name">${faceset}</span> ${faceindex}
                        </div>
                    </div>
                    <div class="card-body" style="display: flex; gap: 15px; align-items: flex-start;">
                        <div class="portrait-container">
                            ${imgHtml}
                        </div>
                        <div class="dialogue-text" style="flex: 1;">${text}</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
